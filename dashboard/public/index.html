<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agentic OS</title>
<style>
  :root {
    color-scheme: light;
    --bg: #f4f4f2; --surface: #fcfcfb; --border: #e3e2de; --grid: #ecebe7;
    --text: #0b0b0b; --text-2: #52514e; --muted: #8a8984;
    --accent: #2a78d6;
    --s-opus: #2a78d6; --s-sonnet: #eb6834; --s-haiku: #1baf7a; --s-otro: #a3a29d;
    --good: #008300; --warn: #c98500; --crit: #e34948;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: #121211; --surface: #1a1a19; --border: #2e2d2b; --grid: #262624;
      --text: #f0efec; --text-2: #c3c2b7; --muted: #8d8c85;
      --accent: #3987e5;
      --s-opus: #3987e5; --s-sonnet: #d95926; --s-haiku: #199e70; --s-otro: #6b6a65;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #121211; --surface: #1a1a19; --border: #2e2d2b; --grid: #262624;
    --text: #f0efec; --text-2: #c3c2b7; --muted: #8d8c85;
    --accent: #3987e5;
    --s-opus: #3987e5; --s-sonnet: #d95926; --s-haiku: #199e70; --s-otro: #6b6a65;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 1180px; margin: 0 auto; padding: 20px 16px 48px; }
  header { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; margin-bottom: 18px; }
  header h1 { font-size: 20px; margin: 0; letter-spacing: -0.01em; }
  header .meta { color: var(--muted); font-size: 13px; }
  header .spacer { flex: 1; }
  select, button, input { font: inherit; color: var(--text); background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 6px 10px; }
  button { cursor: pointer; }
  button:hover { border-color: var(--accent); }
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; margin-bottom: 16px; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; min-width: 0; }
  .kpi .label { color: var(--text-2); font-size: 12px; text-transform: uppercase; letter-spacing: .04em; }
  .kpi .value { font-size: 26px; font-weight: 650; margin-top: 2px; font-variant-numeric: tabular-nums; }
  .kpi .sub { color: var(--muted); font-size: 12px; }
  h2 { font-size: 15px; margin: 0 0 10px; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 16px; }
  @media (max-width: 820px) { .grid2 { grid-template-columns: 1fr; } }
  .chart { width: 100%; height: auto; display: block; }
  .chart text { fill: var(--text-2); font-size: 11px; }
  .chart .gridline { stroke: var(--grid); }
  .chart rect.mark:hover { opacity: .8; }
  .legend { display: flex; gap: 14px; flex-wrap: wrap; margin: 0 0 8px; color: var(--text-2); font-size: 12px; }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 6px 4px; border-bottom: 1px solid var(--grid); }
  th { color: var(--text-2); font-weight: 600; font-size: 12px; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  .projects { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 12px; }
  @media (max-width: 400px) { .projects { grid-template-columns: 1fr; } }
  .project h3 { margin: 0; font-size: 15px; }
  .project .path { color: var(--muted); font-size: 12px; word-break: break-all; margin: 2px 0 10px; }
  .task { display: flex; gap: 8px; align-items: flex-start; padding: 4px 0; }
  .task input { margin-top: 3px; }
  .prio { font-size: 11px; font-weight: 700; border-radius: 5px; padding: 1px 5px; border: 1px solid var(--border); color: var(--text-2); }
  .prio.P0 { color: var(--crit); border-color: var(--crit); }
  .prio.P1 { color: var(--warn); border-color: var(--warn); }
  .addtask { display: flex; gap: 6px; margin-top: 8px; }
  .addtask input[type=text] { flex: 1; min-width: 0; }
  details { margin-top: 10px; border-top: 1px solid var(--grid); padding-top: 8px; }
  summary { cursor: pointer; color: var(--text-2); font-size: 13px; }
  pre { white-space: pre-wrap; font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; color: var(--text-2); margin: 8px 0 0; max-height: 260px; overflow: auto; }
  .empty { color: var(--muted); font-size: 13px; }
  .err { color: var(--crit); }
  .done-list { margin-top: 8px; padding-top: 6px; }
  .done-list .task span { color: var(--muted); text-decoration: line-through; }
  .toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); display: none; align-items: center; gap: 12px; background: var(--text); color: var(--surface); padding: 10px 14px; border-radius: 10px; box-shadow: 0 6px 24px rgba(0,0,0,.25); font-size: 14px; max-width: calc(100% - 32px); }
  .toast.show { display: flex; }
  .toast button { background: transparent; color: var(--surface); border-color: currentColor; font-weight: 600; }
</style>
</head>
<body>
<main>
  <header>
    <h1>Agentic OS</h1>
    <span class="meta" id="meta"></span>
    <span class="spacer"></span>
    <select id="days" aria-label="Periodo">
      <option value="7">7 días</option>
      <option value="30" selected>30 días</option>
      <option value="90">90 días</option>
    </select>
    <button id="refresh">Actualizar</button>
  </header>

  <section class="kpis" id="kpis"></section>

  <section class="card" style="margin-bottom:16px">
    <h2>Tokens por día y modelo</h2>
    <div class="legend" id="legend"></div>
    <div id="daily"></div>
  </section>

  <section class="grid2">
    <div class="card"><h2>Consumo por proyecto</h2><div id="byProject"></div></div>
    <div class="card"><h2>Sesiones recientes</h2><div id="sessions"></div></div>
  </section>

  <h2 style="margin:22px 0 10px">Proyectos y tareas</h2>
  <section class="projects" id="projects"></section>
</main>
<div class="toast" id="toast" role="status" aria-live="polite"><span id="toastMsg"></span><button id="undo">Deshacer</button></div>

<script>
const MODELS = ['opus', 'sonnet', 'haiku', 'otro'];
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const tot = (b) => b ? b.in + b.out + b.cr + b.cc : 0;
const fmt = (n) => n >= 1e9 ? (n / 1e9).toFixed(1) + 'B' : n >= 1e6 ? (n / 1e6).toFixed(1) + 'M' : n >= 1e3 ? Math.round(n / 1e3) + 'k' : String(n);
const breakdown = (b) => `entrada ${fmt(b.in)} · salida ${fmt(b.out)} · cache-read ${fmt(b.cr)} · cache-write ${fmt(b.cc)} · ${b.msgs} msgs`;
const fam = (m) => MODELS.includes(m) ? m : 'otro';
const NS = 'http://www.w3.org/2000/svg';

function kpis(d) {
  const u = d.usage;
  const opus = tot(u.byModel.opus);
  const pct = tot(u.total) ? Math.round((opus / tot(u.total)) * 100) : 0;
  const tiles = [
    ['Ventana 5 h', fmt(tot(u.last5h)), 'tokens (aprox., por horas)'],
    ['Hoy', fmt(tot(u.today)), `${u.today.msgs} respuestas`],
    [`${d.days} días`, fmt(tot(u.total)), `salida ${fmt(u.total.out)}`],
    ['Cuota en Opus', pct + '%', 'del total del periodo'],
    ['Sesiones', String(u.sessions.length), `en ${d.days} días`],
  ];
  $('kpis').innerHTML = tiles.map(([l, v, s]) => `<div class="card kpi"><div class="label">${l}</div><div class="value">${v}</div><div class="sub">${s}</div></div>`).join('');
}

function dailyChart(d) {
  const days = [];
  for (let i = d.days - 1; i >= 0; i--) days.push(new Date(Date.now() - i * 864e5).toLocaleDateString('sv-SE'));
  const rows = days.map((day) => {
    const m = d.usage.byDay[day] || {};
    const seg = {};
    for (const [k, b] of Object.entries(m)) seg[fam(k)] = (seg[fam(k)] || 0) + tot(b);
    return { day, seg, sum: Object.values(seg).reduce((a, b) => a + b, 0) };
  });
  const present = MODELS.filter((m) => rows.some((r) => r.seg[m]));
  $('legend').innerHTML = present.map((m) => `<span><i style="background:var(--s-${m})"></i>${m}</span>`).join('');
  const max = Math.max(1, ...rows.map((r) => r.sum));
  const W = 1100, H = 240, L = 46, B = 22, T = 8;
  const bw = (W - L) / rows.length;
  const y = (v) => H - B - (v / max) * (H - B - T);
  let svg = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Tokens por día">`;
  for (const f of [0, .5, 1]) {
    const v = max * f;
    svg += `<line class="gridline" x1="${L}" x2="${W}" y1="${y(v)}" y2="${y(v)}"/><text x="${L - 6}" y="${y(v) + 4}" text-anchor="end">${fmt(v)}</text>`;
  }
  const every = Math.ceil(rows.length / 10);
  rows.forEach((r, i) => {
    const x = L + i * bw + bw * 0.18, w = Math.max(2, bw * 0.64);
    let acc = 0;
    const segs = present.filter((m) => r.seg[m]);
    segs.forEach((m, j) => {
      const v = r.seg[m];
      const y0 = y(acc), y1 = y(acc + v);
      const top = j === segs.length - 1;
      const h = Math.max(1, y0 - y1 - (top ? 0 : 2));
      svg += `<rect class="mark" x="${x}" y="${y1 + (top ? 0 : 2)}" width="${w}" height="${h}" rx="${top ? 4 : 0}" fill="var(--s-${m})"><title>${r.day} · ${m}: ${fmt(v)} tokens</title></rect>`;
      if (top) svg += `<rect x="${x}" y="${y1 + 4}" width="${w}" height="${Math.max(0, h - 4)}" fill="var(--s-${m})" pointer-events="none"/>`;
      acc += v;
    });
    if (i % every === 0) svg += `<text x="${x + w / 2}" y="${H - 6}" text-anchor="middle">${r.day.slice(5)}</text>`;
  });
  $('daily').innerHTML = svg + '</svg>';
}

function projectBars(d) {
  const entries = Object.entries(d.usage.byProject).sort((a, b) => tot(b[1]) - tot(a[1])).slice(0, 10);
  if (!entries.length) return ($('byProject').innerHTML = '<p class="empty">Sin consumo en el periodo.</p>');
  const max = tot(entries[0][1]);
  const rowH = 26, W = 520, L = 150, R = 56;
  let svg = `<svg class="chart" viewBox="0 0 ${W} ${entries.length * rowH}" role="img" aria-label="Consumo por proyecto">`;
  entries.forEach(([slug, b], i) => {
    const w = Math.max(3, ((W - L - R) * tot(b)) / max);
    const yy = i * rowH;
    svg += `<text x="${L - 8}" y="${yy + 17}" text-anchor="end">${esc(slug.length > 22 ? slug.slice(0, 21) + '…' : slug)}</text>`;
    svg += `<rect class="mark" x="${L}" y="${yy + 6}" width="${w}" height="14" rx="4" fill="var(--accent)"><title>${esc(slug)}: ${breakdown(b)}</title></rect>`;
    svg += `<text x="${L + w + 6}" y="${yy + 17}">${fmt(tot(b))}</text>`;
  });
  $('byProject').innerHTML = svg + '</svg><p class="empty" style="margin:8px 0 0">Entre paréntesis: directorios no registrados.</p>';
}

function sessions(d) {
  const s = d.usage.sessions.slice(0, 12);
  if (!s.length) return ($('sessions').innerHTML = '<p class="empty">Sin sesiones.</p>');
  const dur = (a, b) => { const m = Math.round((Date.parse(b) - Date.parse(a)) / 6e4); return m >= 60 ? `${Math.floor(m / 60)} h ${m % 60} min` : `${m} min`; };
  $('sessions').innerHTML = `<table><thead><tr><th>Inicio</th><th>Proyecto</th><th class="num">Duración</th><th class="num">Tokens</th></tr></thead><tbody>${
    s.map((x) => `<tr><td>${new Date(x.first).toLocaleString('es-ES', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' })}</td><td>${esc(x.project)}</td><td class="num">${dur(x.first, x.last)}</td><td class="num">${fmt(x.tokens)}</td></tr>`).join('')
  }</tbody></table>`;
}

function projects(d) {
  if (!d.projects.length) {
    $('projects').innerHTML = '<div class="card empty">No hay proyectos registrados. Abre Claude Code en un proyecto y ejecuta <code>/aos-register</code>.</div>';
    return;
  }
  const order = { P0: 0, P1: 1, P2: 2, P3: 3 };
  $('projects').innerHTML = d.projects.map((p) => {
    const open = p.tasks.filter((t) => !t.done).sort((a, b) => order[a.prio] - order[b.prio]);
    const done = p.tasks.filter((t) => t.done).sort((a, b) => (b.doneAt || '').localeCompare(a.doneAt || ''));
    return `<article class="card project" data-slug="${esc(p.slug)}">
      <h3>${esc(p.name)}</h3>
      <div class="path">${p.localPath ? esc(p.localPath) : 'No clonado en este equipo'}</div>
      ${open.length ? open.map((t) => `<label class="task"><input type="checkbox" data-id="${esc(t.id)}"><span><span class="prio ${t.prio}">${t.prio}</span> ${esc(t.title)}${t.due ? ` <span class="empty">@${esc(t.due)}</span>` : ''}</span></label>`).join('') : '<p class="empty">Sin tareas abiertas.</p>'}
      ${done.length ? `<details class="done-list"><summary>${done.length} hecha${done.length > 1 ? 's' : ''} · desmarca para reabrir</summary>${done.map((t) => `<label class="task"><input type="checkbox" checked data-id="${esc(t.id)}"><span><span class="prio ${t.prio}">${t.prio}</span> ${esc(t.title)}${t.doneAt ? ` · ${esc(t.doneAt)}` : ''}</span></label>`).join('')}</details>` : ''}
      <form class="addtask"><select name="prio" aria-label="Prioridad"><option>P0</option><option>P1</option><option selected>P2</option><option>P3</option></select><input type="text" name="title" placeholder="Nueva tarea…" required><button>Añadir</button></form>
      ${p.handoff ? `<details><summary>Última sesión · ${esc(p.handoff.date)}${p.handoff.auto ? ' (automático)' : ''}</summary><pre>${esc(p.handoff.text)}</pre></details>` : ''}
    </article>`;
  }).join('');
}

async function post(url, body) {
  const r = await fetch(url, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body || {}) });
  if (!r.ok) throw new Error((await r.json()).error || r.statusText);
}

let undoTimer, lastDone = null;
function toast(msg, undo) {
  $('toastMsg').textContent = msg;
  $('undo').style.display = undo ? '' : 'none';
  $('toast').classList.add('show');
  clearTimeout(undoTimer);
  undoTimer = setTimeout(() => { $('toast').classList.remove('show'); lastDone = null; }, 6000);
}
async function setDone(slug, id, done) {
  await post(`/api/projects/${slug}/tasks/${id}/${done ? 'done' : 'reopen'}`);
  await load();
}
$('projects').addEventListener('change', async (e) => {
  if (!e.target.matches('input[type=checkbox]')) return;
  const slug = e.target.closest('[data-slug]').dataset.slug, id = e.target.dataset.id, done = e.target.checked;
  try {
    await setDone(slug, id, done);
    lastDone = done ? { slug, id } : null;
    toast(done ? 'Tarea completada' : 'Tarea reabierta', done);
  } catch (err) { alert(err.message); e.target.checked = !done; }
});
$('undo').addEventListener('click', async () => {
  if (!lastDone) return;
  const { slug, id } = lastDone; lastDone = null;
  try { await setDone(slug, id, false); toast('Tarea reabierta', false); } catch (err) { alert(err.message); }
});
$('projects').addEventListener('submit', async (e) => {
  e.preventDefault();
  const f = e.target, slug = f.closest('[data-slug]').dataset.slug;
  try { await post(`/api/projects/${slug}/tasks`, { title: f.title.value, prio: f.prio.value }); load(); } catch (err) { alert(err.message); }
});

async function load() {
  try {
    const days = $('days').value;
    const d = await (await fetch(`/api/data?days=${days}`)).json();
    $('meta').textContent = `equipo ${d.machine} · ${new Date(d.generatedAt).toLocaleTimeString('es-ES')}`;
    kpis(d); dailyChart(d); projectBars(d); sessions(d); projects(d);
  } catch (e) {
    $('kpis').innerHTML = `<div class="card err">No se pudo cargar: ${esc(e.message)}</div>`;
  }
}
try { const saved = localStorage.getItem('aos-days'); if (saved) $('days').value = saved; } catch {}
$('days').addEventListener('change', () => { try { localStorage.setItem('aos-days', $('days').value); } catch {} load(); });
$('refresh').addEventListener('click', load);
load();
setInterval(load, 60000);
</script>
</body>
</html>
